# Render Blueprint: one Docker web service (Django API + built React app).
services:
  - type: web
    name: weather-truck-routing
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: .onrender.com
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      # Optional: persist trips across deploys with a managed database.
      # - key: DATABASE_URL
      #   fromDatabase: { name: truck-routing-db, property: connectionString }
